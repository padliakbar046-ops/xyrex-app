<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0e">
<title>XYREX</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">X</div>
      <div>
        <h1>XYREX</h1>
        <span class="sub">unrestricted engine</span>
      </div>
      <button id="closeSidebar" class="close-sidebar" aria-label="close">✕</button>
    </div>
    <button id="newChat" class="btn-new">+ New Chat</button>
    <div id="history" class="history"></div>
    <button id="openSettings" class="btn-settings">Settings</button>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="toggleSidebar" class="icon-btn">☰</button>
      <div id="modelLabel" class="model-label">no model</div>
      <div class="status" id="status">idle</div>
    </header>

    <section id="messages"></section>

    <footer id="composer">
      <textarea id="input" placeholder="kirim perintah ke XYREX..." rows="1"></textarea>
      <button id="send" class="btn-send">→</button>
    </footer>
  </main>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <h2>Settings</h2>
    <label>API Key</label>
    <input id="apiKey" type="password" placeholder="sk-...">
    <label>Base URL</label>
    <input id="baseUrl" type="text" value="https://openrouter.ai/api/v1">
    <label>Model</label>
    <input id="modelInput" type="text" placeholder="meta-llama/llama-3.3-70b-instruct:free">
    <div class="modal-actions">
      <button id="saveSettings" class="btn-primary">Save</button>
      <button id="closeSettings" class="btn-ghost">Close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
