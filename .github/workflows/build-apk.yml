name: Build XYREX RAT APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build APK
      working-directory: ./xyrex-rat-android
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: xyrex-rat-apk
        # Cari file .apk di mana aja di dalam folder xyrex-rat-android
        path: xyrex-rat-android/**/*.apk
        if-no-files-found: error
