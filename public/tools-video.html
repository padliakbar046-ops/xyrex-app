<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYREX - Video Downloader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(180deg, #c8d6ee 0%, #dbe4f5 100%); min-height: 100vh; padding-bottom: 30px; }
  .topbar { background: #fff; border-bottom: 3px solid #0a0a0a; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .back-btn { width: 44px; height: 44px; border: 3px solid #0a0a0a; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 #0a0a0a; text-decoration: none; color: #0a1a3a; }
  .topbar .brand { font-size: 20px; font-weight: 800; color: #0a1a3a; }
  .topbar .user-mini { margin-left: auto; background: #f5f8ff; border: 2px solid #0a0a0a; border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; color: #0a1a3a; }
  .title-wrap { padding: 20px 22px 10px 22px; }
  .title { font-size: 28px; font-weight: 800; color: #0a1a3a; }
  .title span { color: #ff0050; }
  .subtitle { color: #4a5a7a; font-size: 13px; margin-top: 4px; }
  .card { background: #fff; border: 3px solid #0a0a0a; border-radius: 18px; margin: 16px 22px; padding: 18px; box-shadow: 4px 4px 0 #0a0a0a; }
  input { width: 100%; padding: 14px; border: 3px solid #0a0a0a; border-radius: 12px; font-size: 14px; margin-bottom: 12px; background: #f5f8ff; }
  input:focus { outline: none; border-color: #ff0050; }
  label { display: block; font-weight: 700; color: #0a1a3a; margin-bottom: 8px; font-size: 13px; }
  .btn { display: block; width: 100%; padding: 14px; border: 3px solid #0a0a0a; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0 #0a0a0a; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0a0a0a; }
  .btn-primary { background: #ff0050; color: #fff; }
  .btn-dl { background: #25d366; color: #fff; text-decoration: none; display: block; text-align: center; margin-top: 8px; }
  .result { display: none; margin-top: 14px; }
  .result.show { display: block; }
  .result video { width: 100%; border-radius: 12px; border: 3px solid #0a0a0a; margin-bottom: 10px; background: #000; }
  .result .info { font-size: 12px; color: #4a5a7a; margin-bottom: 10px; line-height: 1.5; }
  .info-box { background: #fff3cd; border: 2px solid #856404; border-radius: 10px; padding: 12px; font-size: 12px; color: #856404; margin-bottom: 12px; line-height: 1.5; }
</style>
<link rel="stylesheet" href="smooth.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/tools.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
  <div class="brand">Video Downloader</div>
  <div class="user-mini" id="userMini">-</div>
</div>

<div class="title-wrap">
  <div class="title">Video <span>Downloader</span></div>
  <div class="subtitle">Tanpa watermark - TikTok, IG, YT, FB</div>
</div>

<div class="card">
  <label>Link Video</label>
  <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/@user/video/xxxxx">
  <button class="btn btn-primary" onclick="download()">Download</button>
  <div class="info-box">Support: TikTok, Instagram, YouTube, Facebook, Twitter/X.</div>
  <div style="margin-top:14px; font-size:12px; font-weight:800; color:#4a5a7a; letter-spacing:1px; text-transform:uppercase;">Platform Support</div>
  <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:10px;">
    <div style="background:#f5f8ff; border:2px solid #0a0a0a; border-radius:12px; padding:12px; text-align:center;">
      <div style="font-weight:800; color:#0a1a3a; font-size:13px;">TikTok</div>
      <div style="font-size:11px; color:#4a5a7a; margin-top:2px;">No watermark</div>
    </div>
    <div style="background:#f5f8ff; border:2px solid #0a0a0a; border-radius:12px; padding:12px; text-align:center;">
      <div style="font-weight:800; color:#0a1a3a; font-size:13px;">Instagram</div>
      <div style="font-size:11px; color:#4a5a7a; margin-top:2px;">Reels / Post</div>
    </div>
    <div style="background:#f5f8ff; border:2px solid #0a0a0a; border-radius:12px; padding:12px; text-align:center;">
      <div style="font-weight:800; color:#0a1a3a; font-size:13px;">YouTube</div>
      <div style="font-size:11px; color:#4a5a7a; margin-top:2px;">Short / Video</div>
    </div>
    <div style="background:#f5f8ff; border:2px solid #0a0a0a; border-radius:12px; padding:12px; text-align:center;">
      <div style="font-weight:800; color:#0a1a3a; font-size:13px;">Facebook</div>
      <div style="font-size:11px; color:#4a5a7a; margin-top:2px;">Video / Reels</div>
    </div>
  </div>
  <div id="result" class="result">
    <video id="videoPlayer" controls></video>
    <div class="info" id="videoInfo"></div>
    <a id="dlLink" class="btn btn-dl" href="#" download>Download Video</a>
  </div>
</div>

<script>
const token = localStorage.getItem('xyrex_token');
const user = localStorage.getItem('xyrex_user');
if (!token) window.location.href = '/login.html';
document.getElementById('userMini').textContent = (user || '-').toUpperCase();

async function download() {
  const url = document.getElementById('videoUrl').value.trim();
  if (!url) { window.xyrexToast('Isi link video dulu', 'error'); return; }
  const result = document.getElementById('result');
  result.classList.remove('show');

  const btn = document.querySelector('.btn-primary');
  btn.textContent = 'Memproses...';
  btn.disabled = true;

  try {
    const r = await fetch('/api/tools/video?url=' + encodeURIComponent(url), {
      headers: { 'x-auth-token': token }
    });
    const j = await r.json();
    if (!j.ok) {
      window.xyrexToast('Gagal: ' + (j.msg || 'unknown'), 'error');
      btn.textContent = 'Download';
      btn.disabled = false;
      return;
    }

    const player = document.getElementById('videoPlayer');
    player.src = j.url;
    player.load();
    player.onerror = () => {
      window.xyrexToast('Video gagal di-load di player. Coba tombol download.', 'error');
    };
    document.getElementById('videoInfo').textContent = 'Judul: ' + (j.title || '-') + ' | Platform: ' + (j.platform || '-');
    const dl = document.getElementById('dlLink');
    dl.href = j.url;
    dl.setAttribute('download', 'video_' + Date.now() + '.mp4');
    dl.setAttribute('target', '_blank');
    result.classList.add('show');
    btn.textContent = 'Download';
    btn.disabled = false;
  } catch (e) {
    window.xyrexToast('Error: ' + e.message, 'error');
    btn.textContent = 'Download';
    btn.disabled = false;
  }
}
</script>

<script src="/tools-toast.js"></script>
<script src="/global-player-iframe.js"></script>
<script src="loading.js"></script>
<script src="auth-ui.js"></script>
</body>
</html>
