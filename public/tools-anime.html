<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYREX - Nonton Anime</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(180deg, #c8d6ee 0%, #dbe4f5 100%); min-height: 100vh; padding-bottom: 30px; }
  .topbar { background: #fff; border-bottom: 3px solid #0a0a0a; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; }
  .back-btn { width: 44px; height: 44px; border: 3px solid #0a0a0a; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 #0a0a0a; text-decoration: none; color: #0a1a3a; }
  .topbar .brand { font-size: 20px; font-weight: 800; color: #0a1a3a; }
  .topbar .user-mini { margin-left: auto; background: #f5f8ff; border: 2px solid #0a0a0a; border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; color: #0a1a3a; }
  .title-wrap { padding: 20px 22px 10px 22px; }
  .title { font-size: 28px; font-weight: 800; color: #0a1a3a; }
  .title span { color: #8b5cf6; }
  .subtitle { color: #4a5a7a; font-size: 13px; margin-top: 4px; }
  .card { background: #fff; border: 3px solid #0a0a0a; border-radius: 18px; margin: 16px 22px; padding: 18px; box-shadow: 4px 4px 0 #0a0a0a; }
  input { width: 100%; padding: 14px; border: 3px solid #0a0a0a; border-radius: 12px; font-size: 14px; margin-bottom: 12px; background: #f5f8ff; }
  input:focus { outline: none; border-color: #8b5cf6; }
  .btn { display: block; width: 100%; padding: 14px; border: 3px solid #0a0a0a; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0 #0a0a0a; background: #8b5cf6; color: #fff; }
  .anime-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .anime-card { background: #f5f8ff; border: 2px solid #0a0a0a; border-radius: 12px; overflow: hidden; cursor: pointer; }
  .anime-card img { width: 100%; height: 180px; object-fit: cover; background: #ddd; }
  .anime-card .ac-title { padding: 8px; font-size: 12px; font-weight: 700; color: #0a1a3a; line-height: 1.3; }
  .ep-list { max-height: 400px; overflow-y: auto; }
  .ep-item { background: #f5f8ff; border: 2px solid #0a0a0a; border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; font-weight: 700; color: #0a1a3a; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/tools.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
  <div class="brand">Nonton Anime</div>
  <div class="user-mini" id="userMini">-</div>
</div>

<div class="title-wrap">
  <div class="title">Nonton <span>Anime</span></div>
  <div class="subtitle">Subtitle Indonesia gratis</div>
</div>

<div class="card">
  <input type="text" id="searchInput" placeholder="Cari anime... (misal: naruto)">
  <button class="btn" onclick="searchAnime()">Cari</button>
  <div style="margin-top:14px; font-size:12px; font-weight:800; color:#4a5a7a; letter-spacing:1px; text-transform:uppercase;">Sedang Populer</div>
  <div id="animeResult" class="anime-grid" style="margin-top:14px;"></div>
</div>

<script>
const token = localStorage.getItem('xyrex_token');
const user = localStorage.getItem('xyrex_user');
if (!token) window.location.href = '/login.html';
document.getElementById('userMini').textContent = (user || '-').toUpperCase();


async function loadTrendingAnime() {
  const grid = document.getElementById('animeResult');
  grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:16px; color:#7a8aaa;">Memuat trending...</div>';
  try {
    const r = await fetch('/api/tools/anime/trending', { headers: { 'x-auth-token': token } });
    const j = await r.json();
    if (!j.ok || !j.results || j.results.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#7a8aaa; padding:20px;">Trending tidak tersedia</div>';
      return;
    }
    renderAnime(j.results);
  } catch (e) {
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#7a8aaa; padding:20px;">Gagal load trending</div>';
  }
}

function renderAnime(animeList) {
  const grid = document.getElementById('animeResult');
  grid.innerHTML = '';
  animeList.forEach(a => {
    const el = document.createElement('div');
    el.className = 'anime-card';
    el.innerHTML = '<img src="' + (a.image || '') + '" alt="" onerror="this.style.display=\'none\'"><div class="ac-title">' + a.title + '</div>';
    el.onclick = () => watchAnime(a.url);
    grid.appendChild(el);
  });
}

async function searchAnime() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { alert('Masukkan judul anime'); return; }
  try {
    const r = await fetch('/api/tools/anime/search?q=' + encodeURIComponent(q), {
      headers: { 'x-auth-token': token }
    });
    const j = await r.json();
    if (!j.ok) { alert('Gagal: ' + (j.msg || 'unknown')); return; }
    const grid = document.getElementById('animeResult');
    grid.innerHTML = '';
    if (!j.results || j.results.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#7a8aaa; padding:20px;">Anime tidak ditemukan</div>';
      return;
    }
    renderAnime(j.results);
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

window.addEventListener('load', () => { setTimeout(loadTrendingAnime, 300); });

function watchAnime(url) {
  window.open(url, '_blank');
}
</script>

<script src="/tools-toast.js"></script>
<script src="/global-player-iframe.js"></script>
</body>
</html>
