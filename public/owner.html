  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(180deg, #c8d6ee 0%, #dbe4f5 100%); min-height: 100vh; padding-bottom: 30px; }
  .topbar { background: #fff; border-bottom: 3px solid #0a0a0a; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .hamburger { width: 44px; height: 44px; border: 3px solid #0a0a0a; border-radius: 12px; background: #1a5fd6; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; box-shadow: 3px 3px 0 #0a0a0a; }
  .hamburger:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0a0a0a; }
  .hamburger span { display: block; width: 22px; height: 3px; background: #fff; border-radius: 2px; }
  .topbar .brand { font-size: 20px; font-weight: 800; color: #0a1a3a; }
  .topbar .user-mini { margin-left: auto; background: #f5f8ff; border: 2px solid #0a0a0a; border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; color: #0a1a3a; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 200; }
  .overlay.show { display: block; }
  .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background: #fff; border-right: 3px solid #0a0a0a; z-index: 300; transition: left 0.25s ease; overflow-y: auto; }
  .sidebar.show { left: 0; }
  .sidebar-head { background: linear-gradient(135deg, #0a1a3a 0%, #1e3a6e 100%); padding: 22px 18px; border-bottom: 3px solid #0a0a0a; }
  .sidebar-head .s-title { color: #ffe600; font-size: 22px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 10px #ffe600; }
  .sidebar-head .s-sub { color: #a8b8d8; font-size: 12px; margin-top: 4px; }

  .card-head { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; color: #0a1a3a; margin-bottom: 12px; }
  .btn { display: inline-block; padding: 12px 18px; border: 3px solid #0a0a0a; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 #0a0a0a; text-decoration: none; margin: 4px 4px 4px 0; }

<script>
const token = localStorage.getItem('xyrex_token');
const role = localStorage.getItem('xyrex_role');
const user = localStorage.getItem('xyrex_user');

if (!token) { window.location.href = '/login.html'; }
if (role !== 'owner') {
  alert('Hanya Owner yang bisa akses halaman ini');
  window.location.href = '/index.html';
}

document.getElementById('userMini').textContent = (user || '-').toUpperCase();
document.getElementById('sidebarUser').textContent = user || '-';
document.getElementById('sidebarRole').textContent = (role || '-').toUpperCase();

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}

async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST', headers: { 'x-auth-token': token } }); } catch(e) {}
  localStorage.removeItem('xyrex_player');
  localStorage.removeItem('xyrex_token');
  localStorage.removeItem('xyrex_user');
  localStorage.removeItem('xyrex_role');
  window.location.href = '/login.html';
}

function showMsg(txt, ok) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
  setTimeout(() => { el.style.display = 'none'; el.className = 'msg'; }, 3000);
}

async function loadUsers() {
  const r = await fetch('/api/users', { headers: { 'x-auth-token': token } });
  const j = await r.json();
  if (!j.ok) { showMsg(j.msg, false); return; }
  const list = document.getElementById('userList');
  list.innerHTML = '';
  j.users.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item';
    const badgeClass = 'badge-' + u.role;
    div.innerHTML = `
      <div class="uname">${u.username}<span class="badge ${badgeClass}">${u.role.toUpperCase()}</span></div>
      <div class="uinfo">Dibuat: ${new Date(u.createdAt).toLocaleString('id-ID')} oleh ${u.createdBy}</div>
      <div class="actions">
        ${u.role === 'owner' ? '<span style="font-size:12px;color:#0a7a2a;font-weight:700;">Owner tidak bisa diubah</span>' : `
          <select onchange="changeRole('${u.username}', this.value)">
            <option value="member" ${u.role==='member'?'selected':''}>Member</option>
            <option value="premium" ${u.role==='premium'?'selected':''}>Premium</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
          </select>
          <button class="btn btn-danger" onclick="deleteUser('${u.username}')">Hapus</button>
        `}
      </div>
    `;
    list.appendChild(div);
  });
}

async function createUser() {
  const username = document.getElementById('newUser').value.trim();
  const password = document.getElementById('newPass').value;
  const role = document.getElementById('newRole').value;
  if (!username || !password) { showMsg('Isi username dan password', false); return; }
  const r = await fetch('/api/users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
    body: JSON.stringify({ username, password, role })
  });
  const j = await r.json();
  showMsg(j.msg, j.ok);
  if (j.ok) {
    document.getElementById('newUser').value = '';
    document.getElementById('newPass').value = '';
    loadUsers();
  }
}

async function deleteUser(username) {
  if (!confirm('Hapus akun ' + username + '?')) return;
  const r = await fetch('/api/users/' + encodeURIComponent(username), {
    method: 'DELETE',
    headers: { 'x-auth-token': token }
  });
  const j = await r.json();
  showMsg(j.msg, j.ok);
  if (j.ok) loadUsers();
}

async function changeRole(username, role) {
  const r = await fetch('/api/users/' + encodeURIComponent(username) + '/role', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
    body: JSON.stringify({ role })
  });
  const j = await r.json();
  showMsg(j.msg, j.ok);
  if (j.ok) loadUsers();
}

loadUsers();
</script>
