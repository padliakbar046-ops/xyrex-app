<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYREX - Pengaturan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(180deg, #c8d6ee 0%, #dbe4f5 100%); min-height: 100vh; padding-bottom: 30px; }
  .topbar { background: #fff; border-bottom: 3px solid #0a0a0a; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .back-btn { width: 44px; height: 44px; border: 3px solid #0a0a0a; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 #0a0a0a; text-decoration: none; color: #0a1a3a; }
  .topbar .brand { font-size: 20px; font-weight: 800; color: #0a1a3a; }
  .topbar .user-mini { margin-left: auto; background: #f5f8ff; border: 2px solid #0a0a0a; border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; color: #0a1a3a; }
  .title-wrap { padding: 20px 22px 10px 22px; }
  .title { font-size: 28px; font-weight: 800; color: #0a1a3a; }
  .title span { color: #1a5fd6; }
  .subtitle { color: #4a5a7a; font-size: 13px; margin-top: 4px; }
  .card { background: #fff; border: 3px solid #0a0a0a; border-radius: 18px; margin: 16px 22px; padding: 20px; box-shadow: 4px 4px 0 #0a0a0a; }
  .card h2 { font-size: 16px; font-weight: 800; color: #0a1a3a; margin-bottom: 14px; }
  label { display: block; font-weight: 700; color: #0a1a3a; margin-bottom: 6px; font-size: 13px; }
  input { width: 100%; padding: 14px; border: 3px solid #0a0a0a; border-radius: 12px; font-size: 14px; margin-bottom: 12px; background: #f5f8ff; }
  input:focus { outline: none; border-color: #1a5fd6; }
  .btn { display: block; width: 100%; padding: 14px; border: 3px solid #0a0a0a; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0 #0a0a0a; background: #1a5fd6; color: #fff; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0a0a0a; }
  .btn-secondary { background: #8b5cf6; }
  .avatar-preview { width: 100px; height: 100px; border: 3px solid #0a0a0a; border-radius: 50%; background: #e0e7ff; color: #4a5a7a; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; margin: 0 auto 14px auto; overflow: hidden; }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-input { display: none; }
  .upload-label { display: block; text-align: center; background: #f5f8ff; border: 3px dashed #0a0a0a; border-radius: 12px; padding: 16px; cursor: pointer; margin-bottom: 12px; font-size: 13px; color: #4a5a7a; }
  .upload-label:active { background: #d4e4ff; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
  <div class="brand">Pengaturan</div>
  <div class="user-mini" id="userMini">-</div>
</div>

<div class="title-wrap">
  <div class="title">Pengaturan <span>Profil</span></div>
  <div class="subtitle">Ubah foto profil dan sandi</div>
</div>

<div class="card">
  <h2>Foto Profil</h2>
  <div class="avatar-preview" id="avatarPreview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 100%; height: 100%; padding: 18px;">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
  </div>
  <input type="file" id="avatarInput" class="avatar-input" accept="image/*" onchange="uploadAvatar(event)">
  <label for="avatarInput" class="upload-label">📷 Pilih Foto Profil (max 5MB)</label>
</div>

<div class="card">
  <h2>Ubah Sandi</h2>
  <label>Sandi Lama</label>
  <input type="password" id="oldPassword" placeholder="Masukkan sandi lama">
  <label>Sandi Baru</label>
  <input type="password" id="newPassword" placeholder="Minimal 6 karakter">
  <label>Konfirmasi Sandi Baru</label>
  <input type="password" id="confirmPassword" placeholder="Ulangi sandi baru">
  <button class="btn" onclick="changePassword()">Ubah Sandi</button>
</div>

<script src="/tools-toast.js"></script>
<script>
const token = localStorage.getItem('xyrex_token');
const user = localStorage.getItem('xyrex_user');
if (!token) window.location.href = '/login.html';
document.getElementById('userMini').textContent = (user || '-').toUpperCase();

function loadProfile() {
  fetch('/api/profile', { headers: { 'x-auth-token': token } })
    .then(r => r.json())
    .then(j => {
      if (j.ok) {
        const av = document.getElementById('avatarPreview');
        if (j.avatar) {
          av.innerHTML = '<img src="' + j.avatar + '">';
        } else {
          // Fallback SVG avatar default
          av.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 100%; height: 100%; padding: 18px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
        }
      }
    });
}
loadProfile();

function uploadAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    window.xyrexToast('Foto max 5MB', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    
    // Update UI LANGSUNG sebelum kirim ke server
    document.getElementById('avatarPreview').innerHTML = '<img src="' + dataUrl + '">';
    window.xyrexToast('Mengunggah foto...', 'info');

    fetch('/api/profile/avatar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
      body: JSON.stringify({ avatar: dataUrl })
    })
    .then(r => r.json())
    .then(j => {
      if (j.ok) {
        window.xyrexToast('Foto profil berhasil diupdate!', 'success');
        loadProfile();
      } else {
        window.xyrexToast('Gagal: ' + j.msg, 'error');
      }
    }).catch(e => window.xyrexToast('Error: ' + e.message, 'error'));
  };
  reader.readAsDataURL(file);
}

function changePassword() {
  const oldPw = document.getElementById('oldPassword').value;
  const newPw = document.getElementById('newPassword').value;
  const confirmPw = document.getElementById('confirmPassword').value;
  if (!oldPw || !newPw || !confirmPw) { window.xyrexToast('Lengkapi semua field', 'error'); return; }
  if (newPw !== confirmPw) { window.xyrexToast('Konfirmasi sandi tidak cocok', 'error'); return; }
  if (newPw.length < 6) { window.xyrexToast('Sandi minimal 6 karakter', 'error'); return; }
  fetch('/api/profile/password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
    body: JSON.stringify({ oldPassword: oldPw, newPassword: newPw })
  })
  .then(r => r.json())
  .then(j => {
    if (j.ok) {
      window.xyrexToast('Sandi berhasil diubah!', 'success');
      document.getElementById('oldPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
    } else {
      window.xyrexToast('Gagal: ' + j.msg, 'error');
    }
  });
}
</script>

</body>
</html>
