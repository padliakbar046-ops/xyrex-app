<script src="/socket.io/socket.io.js"></script>
<script>
const token = localStorage.getItem('xyrex_token');
const role = localStorage.getItem('xyrex_role');
const user = localStorage.getItem('xyrex_user');

if (!token) { window.location.href = '/login.html'; }

document.getElementById('userMini').textContent = (user || '-').toUpperCase();
document.getElementById('sidebarUser').textContent = user || '-';
document.getElementById('sidebarRole').textContent = (role || '-').toUpperCase();

if (role === 'owner') {
  document.getElementById('menuOwner').classList.remove('hidden');
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('overlay').classList.toggle('show');
}

async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST', headers: { 'x-auth-token': token } }); } catch(e) {}
  localStorage.removeItem('xyrex_player');
  localStorage.removeItem('xyrex_token');
  localStorage.removeItem('xyrex_user');
  localStorage.removeItem('xyrex_role');
  window.location.href = '/login.html';
}

const socket = io();
const chatBody = document.getElementById('chatBody');
let renderedIds = new Set();

function roleClass(r) {
  return ['owner','admin','premium','member'].includes(r) ? r : 'member';
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function appendMsg(m) {
  const id = m.username + '|' + m.time + '|' + m.message;
  if (renderedIds.has(id)) return;
  renderedIds.add(id);

  const empty = chatBody.querySelector('.chat-empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'chat-msg' + (m.username === user ? ' self' : '');
  div.innerHTML = `
    <div class="cm-head">
      <span class="cm-user">${escapeHtml(m.username)}</span>
      <span class="cm-role ${roleClass(m.role)}">${(m.role || 'member').toUpperCase()}</span>
    </div>
    <div class="cm-text">${escapeHtml(m.message)}</div>
    <div class="cm-time">${fmtTime(m.time)}</div>
  `;
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('chatSend', { username: user, role: role, message: text });
  input.value = '';
}

socket.on('chatHistory', (msgs) => {
  chatBody.innerHTML = '';
  renderedIds.clear();
  if (!msgs || msgs.length === 0) {
    chatBody.innerHTML = '<div class="chat-empty">Belum ada pesan. Jadilah yang pertama!</div>';
    return;
  }
  msgs.forEach(appendMsg);
});

socket.on('chatMessage', (m) => { appendMsg(m); });
</script>
