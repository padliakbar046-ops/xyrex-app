<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYREX - Chat Public</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(180deg, #c8d6ee 0%, #dbe4f5 100%); min-height: 100vh; padding-bottom: 30px; }
  .topbar { background: #fff; border-bottom: 3px solid #0a0a0a; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .back-btn { width: 44px; height: 44px; border: 3px solid #0a0a0a; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 #0a0a0a; text-decoration: none; color: #0a1a3a; }
  .topbar .brand { font-size: 20px; font-weight: 800; color: #0a1a3a; }
  .topbar .user-mini { margin-left: auto; background: #f5f8ff; border: 2px solid #0a0a0a; border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; color: #0a1a3a; }
  .title-wrap { padding: 20px 22px 10px 22px; }
  .title { font-size: 28px; font-weight: 800; color: #0a1a3a; }
  .title span { color: #1a5fd6; }
  .subtitle { color: #4a5a7a; font-size: 13px; margin-top: 4px; }
  .chat-container { background: #fff; border: 3px solid #0a0a0a; border-radius: 18px; margin: 16px 22px; box-shadow: 4px 4px 0 #0a0a0a; overflow: hidden; display: flex; flex-direction: column; height: 70vh; }
  .chat-head { background: #0a1a3a; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .chat-head .ch-title { color: #ffe600; font-size: 16px; font-weight: 800; }
  .chat-head .ch-live { margin-left: auto; background: #25d366; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
  .chat-body { flex: 1; overflow-y: auto; padding: 16px; background: #f5f8ff; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { display: flex; flex-direction: column; max-width: 80%; }
  .chat-msg.self { align-self: flex-end; }
  .cm-row { display: flex; gap: 10px; align-items: flex-start; }
  .chat-msg.self .cm-row { flex-direction: row-reverse; }
  .cm-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #0a0a0a; background: #8b5cf6; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; overflow: hidden; }
  .cm-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .cm-content { background: #fff; border: 2px solid #0a0a0a; border-radius: 12px; padding: 8px 12px; box-shadow: 2px 2px 0 #0a0a0a; }
  .chat-msg.self .cm-content { background: #d4e4ff; }
  .cm-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .cm-user { font-size: 13px; font-weight: 800; color: #0a1a3a; }
  .cm-role { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
  .cm-role.member { background: #e0e7ff; color: #1a5fd6; }
  .cm-role.premium { background: #ffe0e0; color: #b00020; }
  .cm-role.admin { background: #f3e8ff; color: #8b5cf6; }
  .cm-role.owner { background: #fff8c5; color: #8a6d00; }
  .cm-text { font-size: 13px; color: #0a1a3a; line-height: 1.4; word-break: break-word; }
  .cm-time { font-size: 10px; color: #7a8aaa; text-align: right; margin-top: 4px; }
  .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 3px solid #0a0a0a; background: #fff; }
  .chat-input-row input { flex: 1; padding: 12px; border: 3px solid #0a0a0a; border-radius: 10px; font-size: 14px; outline: none; }
  .chat-input-row button { padding: 12px 20px; border: 3px solid #0a0a0a; border-radius: 10px; background: #1a5fd6; color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 3px 3px 0 #0a0a0a; }
  .chat-input-row button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0a0a0a; }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
  <div class="brand">Chat Public</div>
  <div class="user-mini" id="userMini">-</div>
</div>

<div class="title-wrap">
  <div class="title">Chat <span>Public</span></div>
  <div class="subtitle">Obrolan bersama semua user XYREX</div>
</div>

<div class="chat-container">
  <div class="chat-head">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffe600" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8z"/></svg>
    <div class="ch-title">Room Global</div>
    <div class="ch-live">LIVE</div>
  </div>
  <div class="chat-body" id="chatBody">
    <div class="chat-empty" style="text-align:center; color:#7a8aaa; font-size:12px; margin:auto;">Belum ada pesan. Jadilah yang pertama!</div>
  </div>
  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Tulis pesan..." maxlength="500" onkeypress="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">Kirim</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/tools-toast.js"></script>
<script>
const token = localStorage.getItem('xyrex_token');
const user = localStorage.getItem('xyrex_user');
const role = localStorage.getItem('xyrex_role');
if (!token) window.location.href = '/login.html';
document.getElementById('userMini').textContent = (user || '-').toUpperCase();

const chatBody = document.getElementById('chatBody');
let renderedIds = new Set();
const socket = io();

function roleClass(r) {
  if (!r) return 'member';
  const lower = String(r).toLowerCase();
  if (['member', 'premium', 'owner', 'admin'].includes(lower)) return lower;
  return 'member';
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function appendMsg(m) {
  const id = m.username + '|' + m.time + '|' + m.message;
  if (renderedIds.has(id)) return;
  renderedIds.add(id);

  const empty = chatBody.querySelector('.chat-empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'chat-msg' + (m.username === user ? ' self' : '');
  
  const initial = (m.username || '?').charAt(0).toUpperCase();
  
  // LOGIKA BARU: Langsung pakai m.avatar kalau ada
  let avatarHtml = '<div class="cm-avatar">' + initial + '</div>';
  if (m.avatar && m.avatar.trim() !== '') {
    avatarHtml = '<div class="cm-avatar"><img src="' + m.avatar + '"></div>';
  }
  
  const roleCls = roleClass(m.role);
  const roleLabel = (m.role || 'member').toUpperCase();
  
  div.innerHTML = '<div class="cm-row">' + avatarHtml +
    '<div class="cm-content">' +
    '<div class="cm-head"><span class="cm-user">' + escapeHtml(m.username) + '</span>' +
    '<span class="cm-role ' + roleCls + '">' + roleLabel + '</span></div>' +
    '<div class="cm-text">' + escapeHtml(m.message) + '</div>' +
    '<div class="cm-time">' + fmtTime(m.time) + '</div>' +
    '</div></div>';
  chatBody.appendChild(div);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('chatSend', { username: user, role: role, message: text });
  input.value = '';
}

socket.on('chatHistory', (msgs) => {
  chatBody.innerHTML = '';
  renderedIds.clear();
  if (!msgs || msgs.length === 0) {
    chatBody.innerHTML = '<div class="chat-empty" style="text-align:center; color:#7a8aaa; font-size:12px; margin:auto;">Belum ada pesan. Jadilah yang pertama!</div>';
    return;
  }
  msgs.forEach(appendMsg);
});

socket.on('chatMessage', (m) => { appendMsg(m); });
</script>
</body>
</html>
