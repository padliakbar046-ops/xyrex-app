app = "xyrex-app" # Ganti dengan nama unik jika bentrok
primary_region = "sin" # Singapore (dekat Indonesia)

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "xyrex_data"
  destination = "/app/data" # Kita akan simpan database & auth di sini
